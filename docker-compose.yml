version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postmate-db
    restart: always
    environment:
      POSTGRES_USER: postmate
      POSTGRES_PASSWORD: postmate123
      POSTGRES_DB: postmate
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
